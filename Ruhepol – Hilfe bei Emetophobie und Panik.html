<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruhepol – Hilfe bei Emetophobie und Panik</title>
<style>
:root{--bg:#eef3f5;--card:#fff;--fg:#1c2a31;--mut:#5b6b73;--acc:#1f6f78;--on:#fff;--soft:#d7e8ea;--line:#d3dde1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191e;--card:#1a252b;--fg:#e6eef1;--mut:#9fb0b8;--acc:#5cc0c9;--on:#0b1418;--soft:#233840;--line:#2b3a42}}
:root[data-theme="dark"]{--bg:#11191e;--card:#1a252b;--fg:#e6eef1;--mut:#9fb0b8;--acc:#5cc0c9;--on:#0b1418;--soft:#233840;--line:#2b3a42}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 "Avenir Next","Nunito","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:1.9rem;line-height:1.2;margin:.2em 0 .3em;font-weight:700}
h2{font-size:1.3rem;margin:.3em 0}
p{margin:.4em 0 1em}.mut,small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--acc);color:var(--on);font-weight:600}
button.big{display:block;width:100%;text-align:left;margin:10px 0;padding:18px;font-size:1.05rem;background:var(--card);color:var(--fg);border:1px solid var(--line)}
button.big:first-of-type{background:var(--acc);color:var(--on)}
button.ghost{background:none;color:var(--mut);font-weight:500}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=text]{flex:1;min-width:0;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}
.center{text-align:center}
.num{font-size:3rem;font-weight:700;color:var(--acc);line-height:1.1}
#br{width:220px;height:220px;margin:28px auto;border-radius:50%;background:radial-gradient(circle,var(--acc),var(--soft));display:grid;place-items:center;transform:scale(.6);transition:transform 4s ease-in-out;color:var(--on);font-weight:700;font-size:1.2rem}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.step.d{opacity:.6}.chk{display:flex;gap:12px;align-items:flex-start}.chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc)}
.chart{display:flex;align-items:flex-end;gap:4px;height:80px;margin:8px 0}.chart i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}summary{cursor:pointer;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 2px;font-size:.8rem;font-weight:500}
nav button.on{color:var(--acc);font-weight:700}
@media (prefers-reduced-motion:reduce){#br{transition-duration:.01s!important}}
</style></head><body>
<main id="m"></main>
<nav><button data-t="sos" onclick="go('sos')">🆘<br>Akut</button><button data-t="lad" onclick="go('lad')">🪜<br>Schritte</button><button data-t="soz" onclick="go('soz')">👥<br>Sozial</button><button data-t="tag" onclick="go('tag')">📓<br>Tagebuch</button><button data-t="wis" onclick="go('wis')">💡<br>Wissen</button></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let T=[],before=5,a_=3;
const clr=()=>{T.forEach(clearTimeout);T=[]},later=(f,ms)=>T.push(setTimeout(f,ms));
const L0=[['Das Wort „Erbrechen“ aufschreiben und laut aussprechen',2],['Mit einer vertrauten Person über Übelkeit und Erbrechen sprechen',3],['Einen sachlichen Text über Magen-Darm-Infekte lesen',3],['Das Emoji 🤮 ansehen und die Angstwelle aushalten',4],['Ein Lebensmittel essen, das du aus Angst meidest',5],['Eine Minute auf einem Drehstuhl drehen und das Schwindelgefühl zulassen',6],['Eine Szene mit Erbrechen in einem Film oder einer Serie ansehen',7],['Einen Ort aufsuchen, den du aus Angst meidest',8]];
let ladder=S.get('ladder',null)||L0.map((x,i)=>({id:i,t:x[0],s:x[1],d:false}));
let log=S.get('log',[]);
const save=()=>{S.set('ladder',ladder);S.set('log',log)};
function go(t){clr();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({sos,lad,soz,tag,wis})[t]();scrollTo(0,0)}

function sos(){$('#m').innerHTML=`<h1>Du bist sicher.</h1><p class="mut">Die Welle ist unangenehm, aber sie geht vorbei. Such dir eine Übung aus.</p>
<div class="card"><label>Wie stark ist die Angst gerade? <b id="bv">${before}</b> von 10</label><input type="range" min="0" max="10" value="${before}" aria-label="Angst von 0 bis 10" oninput="before=+this.value;$('#bv').textContent=before"></div>
<button class="big" onclick="breathe()">🌬️ Atemübung (1 Minute)</button>
<button class="big" onclick="ground()">🖐️ Erden: 5-4-3-2-1</button>
<button class="big" onclick="think()">💭 Beruhigende Gedanken</button>
<p class="mut"><small>Bei starken körperlichen Beschwerden: ärztlichen Notdienst 116 117 oder Notruf 112. Telefonseelsorge: 0800 111 0 111 (kostenlos, rund um die Uhr).</small></p>`}

function breathe(){clr();let c=0;$('#m').innerHTML=`<div class="center"><h2>Atme mit dem Kreis</h2><div id="br"><span id="bt">Gleich geht’s los</span></div><p class="mut" id="bc">Lass die Schultern sinken.</p><button class="ghost" onclick="go('sos')">Abbrechen</button></div>`;
const br=$('#br'),bt=$('#bt');
const step=()=>{if(c>=6)return done('Atemübung');c++;$('#bc').textContent=c+' von 6';bt.textContent='Einatmen';br.style.transitionDuration='4s';br.style.transform='scale(1)';
later(()=>{bt.textContent='Ausatmen (lang)';br.style.transitionDuration='6s';br.style.transform='scale(.6)'},4000);later(step,10000)};
later(step,800)}

const G=[['5','Dinge, die du siehst','Schau dich langsam um und benenne fünf Dinge, am besten laut.'],['4','Dinge, die du fühlst','Spür den Stuhl unter dir, deine Füße am Boden, den Stoff deiner Kleidung.'],['3','Dinge, die du hörst','Lausche bewusst: nah, fern, leise.'],['2','Dinge, die du riechst','Nimm zwei Gerüche wahr, zum Beispiel Haut, Luft, Kaffee.'],['1','Ding, das du schmeckst','Spür den Geschmack im Mund oder trink einen Schluck Wasser.']];
function ground(i=0){clr();if(i>=G.length)return done('Erden');const g=G[i];$('#m').innerHTML=`<div class="center card"><div class="num">${g[0]}</div><h2>${g[1]}</h2><p>${g[2]}</p><button class="big" onclick="ground(${i+1})">Weiter</button><button class="ghost" onclick="go('sos')">Abbrechen</button></div>`}

const TH=['Das ist Angst, keine Gefahr. Mein Körper schlägt Alarm, obwohl nichts Schlimmes passiert.','Angst kann Übelkeit auslösen: Stresshormone wirken direkt auf den Magen. Das Gefühl ist unangenehm, aber harmlos.','Angst steigt an, erreicht einen Gipfel und sinkt von selbst wieder. Ich muss dafür nichts tun.','Ich habe diese Welle schon oft überstanden. Ich schaffe das auch jetzt.','Ein Gedanke ist kein Beweis. „Mir wird gleich schlecht“ heißt nicht, dass es passiert.','Ich muss nichts kontrollieren. Ich lasse die Angst da sein und atme langsam aus.'];
function think(i=0){clr();if(i>=TH.length)return done('Gedanken');$('#m').innerHTML=`<div class="center card"><small>${i+1} von ${TH.length}</small><h2 style="margin:.8em 0">${TH[i]}</h2><button class="big" onclick="think(${i+1})">Weiter</button><button class="ghost" onclick="go('sos')">Abbrechen</button></div>`}

function done(tool){clr();a_=Math.max(0,before-1);$('#m').innerHTML=`<div class="card center"><h2>Geschafft 💚</h2><p>Wie stark ist die Angst jetzt?</p><div class="num" id="av">${a_}</div><input type="range" min="0" max="10" value="${a_}" aria-label="Angst jetzt" oninput="a_=+this.value;$('#av').textContent=a_"><p></p><button onclick="saveS('${tool}')">Im Tagebuch speichern</button> <button class="ghost" onclick="go('sos')">Ohne Speichern</button></div>`}
function saveS(tool){log.unshift({t:Date.now(),tr:tool,b:before,a:a_});save();go('tag')}

function lad(){const n=ladder.filter(x=>x.d).length,p=ladder.length?n/ladder.length*100:0;
$('#m').innerHTML=`<h1>Schritt für Schritt</h1><p class="mut">Bei Emetophobie hilft schrittweise Konfrontation (Expositionstherapie). Starte bei einer Stufe, die du dir zutraust, und bleib dabei, bis die Angst spürbar sinkt – ohne Ablenkung und ohne Sicherheitsverhalten. Stimm die Stufen am besten mit einer Therapeutin oder einem Therapeuten ab.</p>
<div class="bar"><i style="width:${p}%"></i></div><p class="mut"><small>${n} von ${ladder.length} geschafft, sortiert nach erwarteter Angst</small></p>
${[...ladder].sort((a,b)=>a.s-b.s).map(x=>`<div class="card step${x.d?' d':''}"><label class="chk"><input type="checkbox" ${x.d?'checked':''} onchange="tgl(${x.id})"><span>${esc(x.t)}</span></label><small>Erwartete Angst: <b>${x.s}</b> von 10</small><input type="range" min="0" max="10" value="${x.s}" aria-label="Erwartete Angst" onchange="sud(${x.id},+this.value)"><button class="ghost" onclick="del(${x.id})"><small>Entfernen</small></button></div>`).join('')}
<div class="row"><input type="text" id="nl" placeholder="Eigene Stufe hinzufügen"><button onclick="addL()">Hinzufügen</button></div>`}
const tgl=id=>{const x=ladder.find(y=>y.id===id);x.d=!x.d;save();lad()};
const sud=(id,v)=>{ladder.find(y=>y.id===id).s=v;save();lad()};
const del=id=>{ladder=ladder.filter(y=>y.id!==id);save();lad()};
function addL(){const v=$('#nl').value.trim();if(!v)return;ladder.push({id:Date.now(),t:v,s:5,d:false});save();lad()}

function tag(){const last=log.slice(0,14).reverse(),f=t=>new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
$('#m').innerHTML=`<h1>Tagebuch</h1><p class="mut">Halte fest, was die Angst ausgelöst hat. So erkennst du Muster – und siehst, dass die Wellen immer wieder sinken.</p>
<div class="card"><input type="text" id="tr" placeholder="Was hat die Angst ausgelöst?" style="width:100%"><p></p><label>Stärke: <b id="tv">5</b> von 10</label><input type="range" min="0" max="10" value="5" aria-label="Stärke" oninput="$('#tv').textContent=this.value"><p></p><button onclick="addE()">Eintrag speichern</button></div>
${last.length?`<div class="card"><small>Angststärke der letzten ${last.length} Einträge</small><div class="chart">${last.map(e=>`<i style="height:${Math.max(4,e.b*10)}%" title="${e.b}"></i>`).join('')}</div></div>`:'<p class="mut">Noch keine Einträge. Dein erster Eintrag erscheint hier.</p>'}
${log.map((e,i)=>`<div class="card"><small>${f(e.t)}</small><br><b>${esc(e.tr||'Ohne Notiz')}</b><br>Angst ${e.b}${e.a!=null?' → '+e.a:''} von 10 <button class="ghost" onclick="delE(${i})"><small>Löschen</small></button></div>`).join('')}`}
function addE(){log.unshift({t:Date.now(),tr:$('#tr').value.trim(),b:+$('#tv').textContent,a:null});save();tag()}
const delE=i=>{log.splice(i,1);save();tag()};

function wis(){$('#m').innerHTML=`<h1>Wissen</h1>
<details open><summary>Was ist Emetophobie?</summary><p>Eine starke Angst vor Erbrechen, vor dem eigenen oder dem anderer. Sie ist gut behandelbar und weiter verbreitet, als viele denken.</p></details>
<details><summary>Warum bleibt die Angst bestehen?</summary><p>Vermeiden und Sicherheitsverhalten fühlen sich kurzfristig erleichternd an, halten die Angst aber am Leben. Typisch sind: Essen meiden, Haltbarkeitsdaten ständig prüfen, Menschen meiden, die krank sein könnten, übermäßiges Händewaschen, Medikamente zur Vorsicht nehmen, ständiges Kontrollieren des Magens.</p></details>
<details><summary>Die Angstwelle</summary><p>Angst steigt an, erreicht einen Gipfel und sinkt von selbst, meist innerhalb von 20 bis 45 Minuten. Jedes Mal, wenn du sie aushältst, lernt dein Gehirn: Das war nicht gefährlich.</p></details>
<details><summary>Was bei Panik im Körper passiert</summary><p>Herzklopfen, Schwindel, Zittern, Übelkeit und Atemnot sind Folgen von Stresshormonen. Sie sind unangenehm, aber nicht gefährlich. Lange Ausatmung beruhigt das Nervensystem.</p></details>
<details><summary>Professionelle Hilfe</summary><p>Die wirksamste Behandlung ist kognitive Verhaltenstherapie mit Exposition. Die Terminservicestelle der Kassenärztlichen Vereinigung vermittelt Therapietermine: 116 117. Diese App ersetzt keine Therapie oder ärztliche Abklärung.</p></details>
<details><summary>Wenn es dir sehr schlecht geht</summary><p>Telefonseelsorge: 0800 111 0 111 oder 0800 111 0 222 (kostenlos, rund um die Uhr). Im Notfall: 112.</p></details>`}
const P0=[['Vor die Haustür oder in den Garten gehen',1],['Eine Runde um den Block gehen',2],['Zum Bäcker oder Supermarkt in der Nähe gehen',3],['In einem Café eine Stunde bleiben',4],['Mit Bus oder Bahn fahren',5],['Mit Freunden in ein Restaurant gehen',6],['Eine Veranstaltung oder ein volles Kino besuchen',7],['Einen Ausflug über Nacht machen',8]];
let places=S.get('places',null)||P0.map((x,i)=>({id:i,t:x[0],s:x[1],d:false}));
let soc=S.get('soc',[]);
const saveP=()=>{S.set('places',places);S.set('soc',soc)};
function soz(){const n=places.filter(x=>x.d).length,p=n/places.length*100;
$('#m').innerHTML=`<h1>Angst vor den Reaktionen der anderen</h1><p class="mut">Oft ist nicht das Erbrechen selbst das Problem, sondern die Vorstellung, vor anderen die Kontrolle zu verlieren und bewertet zu werden. Drei Dinge helfen: die Befürchtung prüfen, den Radius schrittweise erweitern und einen Plan für den Ernstfall haben.</p>
<h2>1. Befürchtung prüfen</h2>
<div class="card"><input type="text" id="sf" style="width:100%" placeholder="Was befürchtest du? Zum Beispiel: Alle starren mich an"><p></p><label>Wie wahrscheinlich ist das? <b id="sp">50</b> %</label><input type="range" min="0" max="100" step="5" value="50" id="sps" aria-label="Wahrscheinlichkeit in Prozent" oninput="$('#sp').textContent=this.value"><p></p><input type="text" id="sr" style="width:100%" placeholder="Was würdest du einem Freund in dieser Lage sagen?"><p></p><button onclick="addS()">Speichern</button></div>
${soc.map((e,i)=>`<div class="card"><b>${esc(e.f)}</b><br><small>Geschätzt: ${e.p} %</small>${e.r?'<br>Was ich einem Freund sagen würde: '+esc(e.r):''}<br><button class="ghost" onclick="delS(${i})"><small>Löschen</small></button></div>`).join('')}
<details><summary>Hilfreiche Fakten</summary><p>Übelkeit und Erbrechen kennt jeder Mensch, viele reagieren hilfsbereit und verständnisvoll. Wir überschätzen meist, wie sehr andere auf uns achten und wie lange sie sich an Peinliches erinnern (Scheinwerfer-Effekt). Und selbst wenn es unangenehm wird: Peinlichkeit ist ein Gefühl, das wieder vergeht.</p></details>
<h2>2. Radius erweitern</h2><p class="mut">Dein Zuhause ist der sichere Ort. Taste dich in kleinen Schritten nach draußen und bleib jeweils, bis die Angst sinkt.</p>
<div class="bar"><i style="width:${p}%"></i></div><p class="mut"><small>${n} von ${places.length} geschafft</small></p>
${[...places].sort((a,b)=>a.s-b.s).map(x=>`<div class="card step${x.d?' d':''}"><label class="chk"><input type="checkbox" ${x.d?'checked':''} onchange="tglP(${x.id})"><span>${esc(x.t)}</span></label><small>Erwartete Angst: <b>${x.s}</b> von 10</small><input type="range" min="0" max="10" value="${x.s}" aria-label="Erwartete Angst" onchange="sudP(${x.id},+this.value)"></div>`).join('')}
<div class="row"><input type="text" id="np" placeholder="Eigenen Ort hinzufügen"><button onclick="addP()">Hinzufügen</button></div>
<h2>3. Plan für den Ernstfall</h2>
<details><summary>Wenn mir unterwegs schlecht wird</summary><p>1. Atme lang aus (Atemübung unter „Akut“).<br>2. Sag einen Satz, den du vorbereitet hast: „Mir ist kurz nicht gut, ich gehe an die frische Luft.“<br>3. Erinnere dich: Angst macht Übelkeit, und sie geht meist vorbei.<br>4. Geh kurz raus, wenn du möchtest, und komm danach zurück, statt den ganzen Ort zu verlassen.</p></details>
<details><summary>Vorstellungsübung: die gefürchtete Szene</summary><p>Schreib die Situation auf, die du am meisten fürchtest, und auch, wie die Menschen darauf reagieren, so konkret wie möglich. Lies den Text täglich laut, bis er an Schrecken verliert. Das ist eine anerkannte Technik der Verhaltenstherapie, am besten gemeinsam mit einer Therapeutin oder einem Therapeuten.</p></details>
<details><summary>Mit anderen darüber sprechen</summary><p>Du musst nichts erklären, aber es entlastet oft, einer vertrauten Person zu sagen: „Ich habe große Angst vor Übelkeit und Erbrechen. Es hilft mir, wenn du ruhig bleibst.“ Üb den Satz vorher laut und teste ihn zuerst bei jemandem, dem du vertraust.</p></details>
<details><summary>Sicherheitsverhalten erkennen</summary><p>Dazu zählen: immer nah an der Tür sitzen, Fluchtwege prüfen, Tabletten oder Tüten dabeihaben, andere fragen, ob sie krank sind, oder Essen im Voraus meiden. Das beruhigt kurzfristig, hält die Angst aber am Leben. Lass immer ein Verhalten pro Woche weg, wenn du dich dazu bereit fühlst.</p></details>`}
const tglP=id=>{const x=places.find(y=>y.id===id);x.d=!x.d;saveP();soz()};
const sudP=(id,v)=>{places.find(y=>y.id===id).s=v;saveP();soz()};
function addP(){const v=$('#np').value.trim();if(!v)return;places.push({id:Date.now(),t:v,s:5,d:false});saveP();soz()}
function addS(){const f=$('#sf').value.trim();if(!f)return;soc.unshift({f,p:+$('#sps').value,r:$('#sr').value.trim()});saveP();soz()}
const delS=i=>{soc.splice(i,1);saveP();soz()};
go('sos');
</script></body></html>
